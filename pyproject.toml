[project]
name = "joycon-to-keyboard"
requires-python = ">=3.11"

# ── Testing ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["helper-app/tests", "tools/tests"]
pythonpath = ["helper-app", "tools"]
addopts = "-v --tb=short"

# ── Coverage ─────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["joycon_helper", "decode_uart_log", "versioning"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0

# ── Ruff (linter + formatter) ───────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["helper-app", "tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "SIM108", # ternary — readability preference
]

[tool.ruff.lint.isort]
known-first-party = ["joycon_helper"]
