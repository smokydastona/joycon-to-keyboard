<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img" aria-label="Helper app background (torn parchment — dark)">
  <defs>
    <!-- Dark desk / table surface beneath the paper (deep blue-black) -->
    <linearGradient id="desk" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="50%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <!-- Desk wood-grain texture (cool blue-grey) -->
    <filter id="woodGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15 0.005" numOctaves="4" seed="42" result="wood"/>
      <feColorMatrix in="wood" type="matrix" values="
        0 0 0 0 0.05
        0 0 0 0 0.06
        0 0 0 0 0.10
        0 0 0 0.4 0" result="woodColor"/>
      <feBlend mode="screen" in="SourceGraphic" in2="woodColor"/>
    </filter>

    <!-- Dark paper gradient (deep blue-grey tones) -->
    <linearGradient id="parchment" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="35%" stop-color="#161c28"/>
      <stop offset="70%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#121620"/>
    </linearGradient>

    <!-- Paper texture: grain with cool blue tint -->
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="5" seed="31" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="
        0.78 0    0    0 0.02
        0    0.80 0    0 0.03
        0    0    0.84 0 0.05
        0    0    0    1 0" result="n2"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="n2"/>
    </filter>

    <!-- Diagonal hatching in pale blue ink -->
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <path d="M0 0 V18" stroke="#4a6a9a" stroke-opacity="0.06" stroke-width="0.9"/>
    </pattern>

    <!-- Cross-hatch at opposite angle -->
    <pattern id="hatch2" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(50)">
      <path d="M0 0 V24" stroke="#3a5a88" stroke-opacity="0.04" stroke-width="0.7"/>
    </pattern>

    <!-- Torn-paper displacement: high scale for ragged torn edges -->
    <filter id="tornEdge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.015" numOctaves="3" seed="12" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Softer wobble for construction lines -->
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.022" numOctaves="2" seed="23" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Drop shadow beneath the paper sheet -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Ink smudge circles for age -->
    <radialGradient id="stain1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a2a48" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#1a2a48" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1a2a48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stain2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#142240" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#142240" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#142240" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Very dark desk surface with wood-grain texture -->
  <rect width="980" height="680" fill="url(#desk)" filter="url(#woodGrain)"/>

  <!-- Torn dark parchment sheet with drop shadow -->
  <g filter="url(#shadow)">
    <g filter="url(#tornEdge)">
      <rect x="28" y="22" width="924" height="636" rx="4" fill="url(#parchment)" filter="url(#paperNoise)"/>
      <rect x="28" y="22" width="924" height="636" rx="4" fill="url(#hatch)"/>
      <rect x="28" y="22" width="924" height="636" rx="4" fill="url(#hatch2)"/>
    </g>
  </g>

  <!-- Scorch / age stains on the dark parchment -->
  <circle cx="780" cy="120" r="60" fill="url(#stain1)"/>
  <circle cx="180" cy="520" r="70" fill="url(#stain2)"/>
  <circle cx="500" cy="660" r="45" fill="url(#stain1)"/>

  <!-- Controller overlay artwork drawn on the dark parchment -->
  <image href="../../joycons-dark.png" x="0" y="0" width="980" height="680" preserveAspectRatio="xMidYMid slice" opacity="0.50"/>

  <!-- Dark blue ballpoint pen construction lines on dark paper -->
  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 144 C 152 76, 250 80, 330 138" stroke="#3a5a88" stroke-opacity="0.18" stroke-width="1.8" stroke-dasharray="3 9"/>
    <path d="M908 522 C 832 404, 700 366, 622 422" stroke="#3a5a88" stroke-opacity="0.18" stroke-width="1.8" stroke-dasharray="3 9"/>
    <path d="M122 488 C 314 410, 546 400, 762 470" stroke="#2a4a70" stroke-opacity="0.09" stroke-width="1.3"/>
  </g>

  <!-- Torn edge darkening — dark stroke on the paper perimeter -->
  <g filter="url(#tornEdge)">
    <rect x="28" y="22" width="924" height="636" rx="4" fill="none" stroke="#0a1020" stroke-opacity="0.40" stroke-width="2.2"/>
  </g>
</svg>
