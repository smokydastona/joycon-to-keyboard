<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img" aria-label="Left Joy-Con background (sketch)">
  <defs>
    <!-- Paper + ink sketch look (no trademarks/logos) -->
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ebd1"/>
      <stop offset="55%" stop-color="#f2e4c6"/>
      <stop offset="100%" stop-color="#ead7b1"/>
    </linearGradient>

    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="
        0.9 0   0   0 0.05
        0   0.9 0   0 0.05
        0   0   0.9 0 0.05
        0   0   0   1 0" result="n2"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="n2"/>
    </filter>

    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M0 0 V12" stroke="#1b1b1b" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <pattern id="cross" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 0 V20" stroke="#1b1b1b" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="1" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="980" height="680" fill="url(#paper)" filter="url(#paperNoise)"/>
  <rect width="980" height="680" fill="url(#hatch)"/>
  <rect width="980" height="680" fill="url(#cross)"/>

  <!-- Left accent "ink wash" + scribbles -->
  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 160 C 140 90, 240 80, 320 130 C 390 175, 360 250, 270 260 C 185 270, 120 230, 90 200" stroke="#2f4a9e" stroke-opacity="0.18" stroke-width="18"/>
    <path d="M58 168 C 140 76, 250 74, 334 134" stroke="#2f4a9e" stroke-opacity="0.28" stroke-width="2.4" stroke-dasharray="2 6"/>
    <path d="M86 230 C 176 292, 280 292, 350 228" stroke="#2f4a9e" stroke-opacity="0.22" stroke-width="2.2"/>
    <path d="M120 312 C 190 340, 242 332, 306 302" stroke="#1b1b1b" stroke-opacity="0.10" stroke-width="1.8"/>
  </g>

  <!-- Border frame (ink) -->
  <g filter="url(#rough)">
    <rect x="16" y="16" width="948" height="648" rx="14" fill="none" stroke="#1b1b1b" stroke-opacity="0.20" stroke-width="1.3"/>
    <rect x="22" y="22" width="936" height="636" rx="12" fill="none" stroke="#1b1b1b" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="6 9"/>
  </g>
</svg>
