<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img" aria-label="Helper app background (torn parchment)">
  <defs>
    <!-- Dark desk / table surface beneath the parchment -->
    <linearGradient id="desk" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a2118"/>
      <stop offset="50%" stop-color="#342a1f"/>
      <stop offset="100%" stop-color="#2a2118"/>
    </linearGradient>

    <!-- Desk wood-grain texture -->
    <filter id="woodGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15 0.005" numOctaves="4" seed="42" result="wood"/>
      <feColorMatrix in="wood" type="matrix" values="
        0 0 0 0 0.18
        0 0 0 0 0.13
        0 0 0 0 0.08
        0 0 0 0.5 0" result="woodColor"/>
      <feBlend mode="screen" in="SourceGraphic" in2="woodColor"/>
    </filter>

    <!-- Warm parchment paper gradient (aged, slightly uneven) -->
    <linearGradient id="parchment" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f0e6d0"/>
      <stop offset="35%" stop-color="#e8d8b8"/>
      <stop offset="70%" stop-color="#e2d0a8"/>
      <stop offset="100%" stop-color="#dcc8a0"/>
    </linearGradient>

    <!-- Aged paper texture: heavy grain, warm multiply -->
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="5" seed="31" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="
        0.88 0    0    0 0.06
        0    0.86 0    0 0.05
        0    0    0.82 0 0.04
        0    0    0    1 0" result="n2"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="n2"/>
    </filter>

    <!-- Diagonal hatching in dark sepia ink -->
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <path d="M0 0 V18" stroke="#3d2b1f" stroke-opacity="0.07" stroke-width="0.9"/>
    </pattern>

    <!-- Cross-hatch at opposite angle -->
    <pattern id="hatch2" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(50)">
      <path d="M0 0 V24" stroke="#4a3828" stroke-opacity="0.045" stroke-width="0.7"/>
    </pattern>

    <!-- Torn-paper displacement: high scale for ragged torn edges -->
    <filter id="tornEdge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.015" numOctaves="3" seed="12" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Softer wobble for construction lines -->
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.022" numOctaves="2" seed="23" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Drop shadow beneath the parchment sheet -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="5" stdDeviation="8" flood-color="#1a1408" flood-opacity="0.45"/>
    </filter>

    <!-- Tea / coffee stain circles for age -->
    <radialGradient id="stain1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b6914" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#8b6914" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8b6914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stain2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6b4f10" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#6b4f10" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#6b4f10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark desk surface with wood-grain texture -->
  <rect width="980" height="680" fill="url(#desk)" filter="url(#woodGrain)"/>

  <!-- Torn parchment sheet with drop shadow -->
  <g filter="url(#shadow)">
    <g filter="url(#tornEdge)">
      <!-- Parchment base — rectangle edges will be displaced by tornEdge filter into ragged tears -->
      <rect x="28" y="22" width="924" height="636" rx="4" fill="url(#parchment)" filter="url(#paperNoise)"/>
      <!-- Sepia-ink hatching baked into the parchment -->
      <rect x="28" y="22" width="924" height="636" rx="4" fill="url(#hatch)"/>
      <rect x="28" y="22" width="924" height="636" rx="4" fill="url(#hatch2)"/>
    </g>
  </g>

  <!-- Age stains on the parchment -->
  <circle cx="780" cy="120" r="60" fill="url(#stain1)"/>
  <circle cx="180" cy="520" r="70" fill="url(#stain2)"/>
  <circle cx="500" cy="660" r="45" fill="url(#stain1)"/>

  <!-- Controller overlay artwork drawn on the parchment -->
  <image href="../../joycons.png" x="0" y="0" width="980" height="680" preserveAspectRatio="xMidYMid slice" opacity="0.80"/>

  <!-- Blue-ink construction lines (guide arcs, kept subtle on the aged paper) -->
  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 144 C 152 76, 250 80, 330 138" stroke="#2f4a9e" stroke-opacity="0.18" stroke-width="1.8" stroke-dasharray="3 9"/>
    <path d="M908 522 C 832 404, 700 366, 622 422" stroke="#2f4a9e" stroke-opacity="0.18" stroke-width="1.8" stroke-dasharray="3 9"/>
    <path d="M122 488 C 314 410, 546 400, 762 470" stroke="#3d2b1f" stroke-opacity="0.09" stroke-width="1.3"/>
  </g>

  <!-- Torn edge darkening — darker stroke on the parchment perimeter, also displaced for matching ragged silhouette -->
  <g filter="url(#tornEdge)">
    <rect x="28" y="22" width="924" height="636" rx="4" fill="none" stroke="#3d2b1f" stroke-opacity="0.28" stroke-width="2.2"/>
  </g>
</svg>
