<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img" aria-label="Helper app background (sketch)">
  <defs>
    <!-- Near-white sketchbook paper — white background with barely-warm wash, matching the Joy-Con overlay sheet -->
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9f7f3"/>
      <stop offset="55%" stop-color="#f5f2eb"/>
      <stop offset="100%" stop-color="#edeae1"/>
    </linearGradient>

    <!-- Paper texture: subtle grain, cooler-toned (less orange multiply) -->
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="
        0.95 0    0    0 0.03
        0    0.96 0    0 0.03
        0    0    0.97 0 0.03
        0    0    0    1 0" result="n2"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="n2"/>
    </filter>

    <!-- Blue-ink diagonal hatching — primary shading layer, like ballpoint pen strokes -->
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <path d="M0 0 V16" stroke="#2f4a9e" stroke-opacity="0.09" stroke-width="0.85"/>
    </pattern>

    <!-- Second diagonal hatch at opposite angle — cross-hatch shading, as seen on Joy-Con overlay surfaces -->
    <pattern id="hatch2" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V22" stroke="#1e3060" stroke-opacity="0.055" stroke-width="0.7"/>
    </pattern>

    <!-- Fine micro-hatch for depth in background corners -->
    <pattern id="microHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-55)">
      <path d="M0 0 V9" stroke="#2f4a9e" stroke-opacity="0.04" stroke-width="0.6"/>
    </pattern>

    <!-- Organic wobble for construction lines and decorative marks -->
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.022" numOctaves="2" seed="23" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Heavier wobble for the outer border — makes it look hand-ruled with a pen -->
    <filter id="roughBorder" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.016" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- White sketchbook paper base -->
  <rect width="980" height="680" fill="url(#paper)" filter="url(#paperNoise)"/>

  <!-- Blue-ink diagonal hatching layers (matching Joy-Con overlay ballpoint shading) -->
  <rect width="980" height="680" fill="url(#hatch)"/>
  <rect width="980" height="680" fill="url(#hatch2)"/>
  <rect width="980" height="680" fill="url(#microHatch)"/>

  <!-- Controller overlay artwork — the same sheet of paper as the rest of the sketch -->
  <image href="../../joycons.png" x="0" y="0" width="980" height="680" preserveAspectRatio="xMidYMid slice" opacity="0.84"/>

  <!-- Blue-ink construction lines: guide arcs and a horizon rule, like a designer's pencil layout marks -->
  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 144 C 152 76, 250 80, 330 138" stroke="#2f4a9e" stroke-opacity="0.22" stroke-width="2.0" stroke-dasharray="3 9"/>
    <path d="M908 522 C 832 404, 700 366, 622 422" stroke="#2f4a9e" stroke-opacity="0.22" stroke-width="2.0" stroke-dasharray="3 9"/>
    <path d="M122 488 C 314 410, 546 400, 762 470" stroke="#1b2a5a" stroke-opacity="0.11" stroke-width="1.3"/>
    <!-- Engineering drawing corner registration marks (L-brackets in blue ink) -->
    <path d="M36 40 L 36 60 M 36 40 L 56 40" stroke="#2f4a9e" stroke-opacity="0.30" stroke-width="1.9" stroke-linecap="square"/>
    <path d="M944 40 L 944 60 M 924 40 L 944 40" stroke="#2f4a9e" stroke-opacity="0.30" stroke-width="1.9" stroke-linecap="square"/>
    <path d="M36 640 L 36 620 M 36 640 L 56 640" stroke="#2f4a9e" stroke-opacity="0.30" stroke-width="1.9" stroke-linecap="square"/>
    <path d="M944 640 L 944 620 M 924 640 L 944 640" stroke="#2f4a9e" stroke-opacity="0.30" stroke-width="1.9" stroke-linecap="square"/>
  </g>

  <!-- Hand-ruled border frame: double stroke, rough displacement — looks pen-drawn, not digital -->
  <g filter="url(#roughBorder)">
    <rect x="18" y="18" width="944" height="644" rx="3" fill="none" stroke="#1b2a5a" stroke-opacity="0.34" stroke-width="2.1"/>
    <rect x="27" y="27" width="926" height="626" rx="2" fill="none" stroke="#2f4a9e" stroke-opacity="0.12" stroke-width="1.1" stroke-dasharray="5 13"/>
  </g>
</svg>
