    <g transform="translate(318,54)">
      <path class="dangerFill" d="M10 8 C 38 0, 118 2, 150 10 C 158 16, 158 24, 150 28 C 118 34, 38 36, 10 28 C 2 22, 2 14, 10 8 Z"/>
      <path class="danger" d="M10 8 C 38 0, 118 2, 150 10 C 158 16, 158 24, 150 28 C 118 34, 38 36, 10 28 C 2 22, 2 14, 10 8 Z"/>
      <text class="muted" x="80" y="22" text-anchor="middle" fill="#2a1f0e" fill-opacity="0.9">Disconnected</text>
