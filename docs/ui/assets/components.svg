  <g transform="translate(582,126)">
    <path class="paperNote" d="M10 10 C 46 2, 190 2, 244 12 C 252 22, 252 38, 242 46 C 192 54, 48 56, 12 46 C 2 38, 2 22, 10 10 Z" filter="url(#paperNoise)"/>
