      <path class="warn" d="M10 8 C 38 0, 108 2, 138 10 C 146 16, 146 24, 138 28 C 108 34, 38 36, 10 28 C 2 22, 2 14, 10 8 Z"/>
      <text class="muted" x="74" y="22" text-anchor="middle" fill="#2a1f0e" fill-opacity="0.9">Discovering...</text>
