      <rect x="12" y="26" width="6" height="6" rx="1.5" fill="none" stroke="#6b5d48" stroke-opacity="0.65" stroke-width="2"/>
    </g>

    <g transform="translate(120,0)">
      <path class="buttonFill" d="M8 10 C 18 2, 34 2, 38 8 C 44 14, 44 30, 38 36 C 30 42, 16 42, 8 34 C 2 28, 2 16, 8 10 Z"/>
      <path class="ink" d="M8 10 C 18 2, 34 2, 38 8 C 44 14, 44 30, 38 36 C 30 42, 16 42, 8 34 C 2 28, 2 16, 8 10 Z"/>
      <path class="success" d="M22 30V14"/>
      <path class="success" d="M15 21l7-8 7 8"/>
      <path class="ghost" d="M13 32c8 2 18 2 24 0"/>
    </g>
  </g>

