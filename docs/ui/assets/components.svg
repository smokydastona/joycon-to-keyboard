<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Themed UI components">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .panel { fill: #0f1a2e; stroke: #22314f; stroke-opacity: 0.9; stroke-width: 1; }
      .text { fill: #e5e7eb; fill-opacity: 0.95; font-family: Segoe UI, Arial, sans-serif; font-size: 14px; }
      .muted { fill: #94a3b8; fill-opacity: 0.9; font-family: Segoe UI, Arial, sans-serif; font-size: 12px; }
      .stroke { stroke: #e5e7eb; stroke-opacity: 0.25; }

      .btn { fill: #111f37; stroke: #22314f; stroke-opacity: 0.95; stroke-width: 1; }
      .btnText { fill: #e5e7eb; font-family: Segoe UI, Arial, sans-serif; font-size: 13px; }
      .btnAccent { fill: #2b63ff; fill-opacity: 0.92; }
      .btnDanger { fill: #ef4444; fill-opacity: 0.90; }

      .pill { fill: #111f37; stroke: #22314f; stroke-opacity: 0.95; stroke-width: 1; }
      .pillOk { fill: #22c55e; fill-opacity: 0.14; stroke: #22c55e; stroke-opacity: 0.7; }
      .pillWarn { fill: #f59e0b; fill-opacity: 0.12; stroke: #f59e0b; stroke-opacity: 0.7; }
      .pillBad { fill: #ef4444; fill-opacity: 0.10; stroke: #ef4444; stroke-opacity: 0.7; }

      .toggleTrack { fill: #111f37; stroke: #22314f; stroke-opacity: 0.95; stroke-width: 1; }
      .toggleOn { fill: #2b63ff; fill-opacity: 0.92; }
      .knob { fill: #e5e7eb; fill-opacity: 0.92; }

      .dialRing { fill: none; stroke: #22314f; stroke-opacity: 0.95; stroke-width: 10; }
      .dialArc { fill: none; stroke: #2b63ff; stroke-opacity: 0.95; stroke-width: 10; stroke-linecap: round; }
      .dialTick { stroke: #94a3b8; stroke-opacity: 0.25; stroke-width: 2; }
      .dialNeedle { stroke: #e5e7eb; stroke-opacity: 0.85; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="520"/>

  <rect class="panel" x="20" y="20" width="940" height="480" rx="14"/>
  <text class="text" x="44" y="54">UI components (theme-matched)</text>
  <text class="muted" x="44" y="76">Buttons • Toggles • Dials • Status pills • Icon buttons</text>

  <!-- Buttons row -->
  <text class="muted" x="44" y="120">Buttons</text>
  <g transform="translate(44,136)">
    <rect class="btn" x="0" y="0" width="160" height="40" rx="10"/>
    <text class="btnText" x="80" y="25" text-anchor="middle">Secondary</text>

    <rect class="btnAccent" x="180" y="0" width="160" height="40" rx="10"/>
    <text class="btnText" x="260" y="25" text-anchor="middle">Primary</text>

    <rect class="btnDanger" x="360" y="0" width="160" height="40" rx="10"/>
    <text class="btnText" x="440" y="25" text-anchor="middle">Danger</text>

    <rect class="btn" x="540" y="0" width="160" height="40" rx="10" fill-opacity="0.5"/>
    <text class="btnText" x="620" y="25" text-anchor="middle" fill-opacity="0.55">Disabled</text>
  </g>

  <!-- Icon buttons row -->
  <text class="muted" x="44" y="220">Icon buttons</text>
  <g transform="translate(44,236)">
    <rect class="btn" x="0" y="0" width="44" height="44" rx="12"/>
    <path d="M22 12a12 12 0 1 0 4 9" fill="none" stroke="#2b63ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 8v16H12" fill="none" stroke="#2b63ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect class="btn" x="60" y="0" width="44" height="44" rx="12"/>
    <path d="M82 10v24l10-10-10-10 10-10-10-10z" fill="none" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect class="btn" x="120" y="0" width="44" height="44" rx="12"/>
    <path d="M142 14v20" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M134 22l8-8 8 8" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Toggles + pills -->
  <text class="muted" x="44" y="320">Toggles + status pills</text>
  <g transform="translate(44,336)">
    <!-- Toggle off -->
    <rect class="toggleTrack" x="0" y="6" width="68" height="28" rx="14"/>
    <circle class="knob" cx="18" cy="20" r="10" fill-opacity="0.65"/>
    <text class="muted" x="84" y="24">Toggle off</text>

    <!-- Toggle on -->
    <rect class="toggleTrack" x="220" y="6" width="68" height="28" rx="14"/>
    <rect class="toggleOn" x="220" y="6" width="68" height="28" rx="14" fill-opacity="0.45"/>
    <circle class="knob" cx="270" cy="20" r="10"/>
    <text class="muted" x="304" y="24">Toggle on</text>

    <!-- Pills -->
    <rect class="pillOk" x="0" y="52" width="130" height="28" rx="14"/>
    <text class="muted" x="65" y="71" text-anchor="middle" fill="#e5e7eb" fill-opacity="0.9">Connected</text>

    <rect class="pillWarn" x="150" y="52" width="150" height="28" rx="14"/>
    <text class="muted" x="225" y="71" text-anchor="middle" fill="#e5e7eb" fill-opacity="0.9">Discovering…</text>

    <rect class="pillBad" x="320" y="52" width="160" height="28" rx="14"/>
    <text class="muted" x="400" y="71" text-anchor="middle" fill="#e5e7eb" fill-opacity="0.9">Disconnected</text>
  </g>

  <!-- Dial -->
  <text class="muted" x="600" y="120">Dial (for deadzone / curve exponent)</text>
  <g transform="translate(600,140)">
    <circle cx="120" cy="120" r="78" class="dialRing"/>
    <path class="dialArc" d="M120 42 A78 78 0 0 1 188 154"/>

    <!-- ticks -->
    <g class="dialTick">
      <path d="M120 32v14"/>
      <path d="M174 50l-8 12"/>
      <path d="M206 96l-14 4"/>
      <path d="M200 152l-12-8"/>
      <path d="M160 198l-6-12"/>
      <path d="M120 208v-14"/>
      <path d="M80 198l6-12"/>
      <path d="M40 152l12-8"/>
      <path d="M34 96l14 4"/>
      <path d="M66 50l8 12"/>
    </g>

    <!-- needle -->
    <path class="dialNeedle" d="M120 120 L 178 150"/>
    <circle cx="120" cy="120" r="6" fill="#e5e7eb" fill-opacity="0.9"/>

    <text class="text" x="120" y="250" text-anchor="middle">Deadzone</text>
    <text class="muted" x="120" y="272" text-anchor="middle">0.15</text>
  </g>
</svg>
