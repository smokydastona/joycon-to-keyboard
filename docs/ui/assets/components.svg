    <g transform="translate(60,0)">
      <path class="buttonFill" d="M8 10 C 18 2, 34 2, 38 8 C 44 14, 44 30, 38 36 C 30 42, 16 42, 8 34 C 2 28, 2 16, 8 10 Z"/>
      <path class="ink" d="M8 10 C 18 2, 34 2, 38 8 C 44 14, 44 30, 38 36 C 30 42, 16 42, 8 34 C 2 28, 2 16, 8 10 Z"/>
      <path class="ink" d="M22 34V13"/>
      <path class="ink" d="M22 13l-5 5"/>
