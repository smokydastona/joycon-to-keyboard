<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-label="Themed UI icons">
  <defs>
    <style>
      .s { stroke: #1b1b1b; stroke-opacity: 0.86; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .m { stroke: #5b554a; stroke-opacity: 0.65; }
      .a { stroke: #2f4a9e; stroke-opacity: 0.95; }
      .g { stroke: #2b6a4b; stroke-opacity: 0.95; }
      .w { stroke: #a16207; stroke-opacity: 0.95; }
      .d { stroke: #b42318; stroke-opacity: 0.95; }
      .t { fill: #5b554a; fill-opacity: 0.95; font-family: Segoe UI, Arial, sans-serif; font-size: 12px; }
    </style>
  </defs>

  <!-- Each icon sits in a 96x96 cell, with a label below. -->

  <!-- Refresh -->
  <g transform="translate(24,16)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="#fff6e1" stroke="#c6ad7d" stroke-opacity="0.9"/>
    <path class="s a" d="M31 50a17 17 0 0 1 28-12"/>
    <path class="s a" d="M59 32h-3c11 1 20 10 20 21 0 12-10 22-22 22-9 0-17-5-20-13"/>
    <path class="s a" d="M55 24l7 14-16 2"/>
    <path class="s a" d="M37 71l-7-14 16-2"/>
    <text class="t" x="48" y="130" text-anchor="middle">refresh</text>
  </g>

  <!-- Bluetooth -->
  <g transform="translate(144,16)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="#fff6e1" stroke="#c6ad7d" stroke-opacity="0.9"/>
    <path class="s" d="M48 16v64l18-16-18-16 18-16-18-16z"/>
    <path class="s m" d="M48 48 30 32"/>
    <path class="s m" d="M48 48 30 64"/>
    <text class="t" x="48" y="130" text-anchor="middle">bluetooth</text>
  </g>

  <!-- USB plug -->
  <g transform="translate(264,16)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="#fff6e1" stroke="#c6ad7d" stroke-opacity="0.9"/>
    <path class="s" d="M48 76V28"/>
    <path class="s" d="M48 28l-7 7"/>
    <path class="s" d="M48 28l7 7"/>
    <path class="s m" d="M48 48h16"/>
    <path class="s m" d="M48 60H32"/>
    <circle cx="64" cy="48" r="4" fill="none" stroke="#5b554a" stroke-opacity="0.65" stroke-width="2.6"/>
    <rect x="26" y="56" width="12" height="12" rx="2" fill="none" stroke="#5b554a" stroke-opacity="0.65" stroke-width="2.6"/>
    <path class="s" d="M48 18v10"/>
    <path class="s" d="M44 18h8"/>
    <text class="t" x="48" y="130" text-anchor="middle">usb</text>
  </g>

  <!-- Keyboard -->
  <g transform="translate(384,16)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="#fff6e1" stroke="#c6ad7d" stroke-opacity="0.9"/>
    <rect x="22" y="30" width="52" height="34" rx="6" fill="none" stroke="#1b1b1b" stroke-opacity="0.85" stroke-width="2.6"/>
    <path class="s m" d="M28 40h6M38 40h6M48 40h6M58 40h6"/>
    <path class="s m" d="M28 50h10M42 50h10M56 50h10"/>
    <path class="s" d="M30 60h36"/>
    <text class="t" x="48" y="130" text-anchor="middle">keyboard</text>
  </g>

  <!-- Upload -->
  <g transform="translate(504,16)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="#fff6e1" stroke="#c6ad7d" stroke-opacity="0.9"/>
    <path class="s g" d="M48 64V28"/>
    <path class="s g" d="M36 40l12-12 12 12"/>
    <path class="s" d="M30 70h36a10 10 0 0 0 10-10v0" transform="translate(96 0) scale(-1 1)"/>
    <text class="t" x="48" y="130" text-anchor="middle">upload</text>
  </g>

  <!-- Download -->
  <g transform="translate(624,16)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="#fff6e1" stroke="#c6ad7d" stroke-opacity="0.9"/>
    <path class="s a" d="M48 32v36"/>
    <path class="s a" d="M36 56l12 12 12-12"/>
    <path class="s" d="M30 70h36a10 10 0 0 0 10-10v0"/>
    <text class="t" x="48" y="130" text-anchor="middle">download</text>
  </g>

  <!-- Warning -->
  <g transform="translate(744,16)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="#fff6e1" stroke="#c6ad7d" stroke-opacity="0.9"/>
    <path class="s w" d="M48 22 76 72H20z"/>
    <path class="s w" d="M48 40v14"/>
    <path class="s w" d="M48 62v1"/>
    <text class="t" x="48" y="130" text-anchor="middle">warning</text>
  </g>

  <!-- Error -->
  <g transform="translate(864,16)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="#fff6e1" stroke="#c6ad7d" stroke-opacity="0.9"/>
    <circle cx="48" cy="48" r="26" class="s d"/>
    <path class="s d" d="M38 38l20 20"/>
    <path class="s d" d="M58 38l-20 20"/>
    <text class="t" x="48" y="130" text-anchor="middle">error</text>
  </g>
</svg>
