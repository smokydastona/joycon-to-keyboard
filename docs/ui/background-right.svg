<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img" aria-label="Right Joy-Con background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <radialGradient id="glowR" cx="78%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="62%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="980" height="680" fill="url(#bg)"/>
  <rect width="980" height="680" fill="url(#glowR)"/>
  <rect width="980" height="680" fill="url(#grid)"/>

  <!-- subtle diagonals (right accent) -->
  <g stroke="#22c55e" stroke-opacity="0.06" stroke-width="2">
    <path d="M 140 720 L 980 -20"/>
    <path d="M 520 720 L 1020 220"/>
    <path d="M -40 180 L 320 -40"/>
  </g>

  <g fill="none" stroke="#e2e8f0" stroke-opacity="0.08" stroke-width="1">
    <rect x="16" y="16" width="948" height="648" rx="14"/>
  </g>
</svg>
