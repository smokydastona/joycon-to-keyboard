# -----------------------------------------------------------
# Deploy web flasher to GitHub Pages
#
# Always-on: deploys whenever web-flasher/ content changes on
# main, after every release, or on manual dispatch.
# Firmware binaries are downloaded from the latest release and
# served alongside the page (same origin — no CORS issues).
# -----------------------------------------------------------
name: Deploy Web Flasher

on:
  push:
    branches: [main]
    paths:
      - "web-flasher/**"
  workflow_run:
    workflows: ["Build Release Bundle"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    # Only deploy after a successful release (workflow_run) or on push/dispatch
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download firmware from latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p web-flasher/firmware

          # Download firmware binaries from the latest release.
          # Release assets are merged binaries (bootloader + partition table + app).
          gh release download --repo "${{ github.repository }}" \
            --pattern "esp32*.bin" \
            --dir web-flasher/firmware \
            --clobber || echo "⚠️ No release found yet — firmware dir will be empty"

          ls -lh web-flasher/firmware/ || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web-flasher

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
